services:
  stacktory:
    image: ghcr.io/zoranner/stacktory:0.2.0
    container_name: stacktory
    restart: always
    ports:
      - 18761:18761
      - 19000:19000
    volumes:
      - ./app/data:/app/data
      - ./app/logs:/app/logs
      - ./app/config.toml:/app/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18761'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  default:
    external: true
    name: stacktory
