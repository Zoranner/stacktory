services:
  stacktory:
    image: ghcr.io/zoranner/stacktory:0.1.0
    container_name: stacktory
    restart: always
    ports:
      - 18761:18761
      - 19000:19000
    volumes:
      - ./app/data:/app/data
      - ./app/logs:/app/logs
      - ./app/config.toml:/app/config.toml:ro
networks:
  default:
    external: true
    name: stacktory
