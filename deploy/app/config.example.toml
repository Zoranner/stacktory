# Stacktory 配置示例
#
# 必填：[server]、[storage]、[rustup]。
# 可选：[proxy]、[upstream]、[retention]；省略 [upstream]/[retention] 时使用默认值。
# 生态 section（[cargo]、[docker]、[npm]、[nuget]、[upm]、[vscode]）按需添加；
# 未配置的生态不会注册路由。
#
# 生态来源的统一结构：
#   [[<ecosystem>.sources]]
#   name = "..."              # 本生态内唯一
#   type = "proxy"            # 叶子来源，直接请求 base_url
#   visible = false           # 可选；不在文档页展示（含 group 成员说明），仍可被 group 引用
#   base_url = "https://..."  # 该生态的协议根地址
#   allow_http = true         # 仅内网 HTTP 源；默认 false
#
#   [[<ecosystem>.sources]]
#   name = "group"
#   type = "group"
#   members = ["a", "b"]      # 按顺序回退；前面的来源失败或 404 时尝试下一个
#
# 注意：
# - [proxy] 是访问上游的出站代理；source 的 type = "proxy" 是上游叶子来源，两者不同。
# - [server].public_url 是主站地址；Docker group 的 public_url 是 Registry 入口，二者不同。

[server]
# 进程监听地址；容器内通常为 0.0.0.0。
address = "0.0.0.0"
# 进程监听端口；不是客户端访问端口。
port = 18000
# 客户端实际访问的地址；经反向代理时端口可以与监听端口不同。
public_url = "https://stacktory.example.internal"

[storage]
# 数据目录和运行日志目录。容器内为 /app/...，宿主机对应 deploy/app/...。
data_dir = "/app/data"
log_dir = "/app/logs"

# 可选：访问上游时使用的 HTTP/HTTPS 出站代理。
# [proxy]
# url = "http://127.0.0.1:7890"
# no_proxy = "localhost,127.0.0.1,.internal"

[upstream]
# 上游请求总超时。metadata 指 manifest、索引等小响应；artifact 指容器层、安装包等大文件。
metadata_timeout_secs = 30
artifact_timeout_secs = 600

# 可选：保留与清理策略。不配置时使用以下默认值；需要覆盖时取消对应注释。
# [retention]
# # 生态 metadata 文件保留时长。
# metadata_retention_secs = 604800
# # 轮转后的审计文件保留天数。
# audit_retention_days = 30
# # 清理任务的执行间隔。
# cleanup_interval_secs = 3600
# # 每个入口和 channel 保留的 Rustup 快照版本数。
# rustup_snapshot_revisions = 3
# # 制品对象空闲超过此时长后删除；0 表示禁用空闲淘汰。
# artifact_idle_secs = 7776000
# # 轮转后的运行日志保留天数。
# log_retention_days = 30

# Rustup 为必填生态；至少配置一个 channel 和一组 sources。
[rustup]
# 上游 manifest 的刷新间隔。
refresh_interval_secs = 3600
# 需要发布的 Rustup channel。
channels = ["stable", "beta", "nightly"]

[[rustup.sources]]
name = "official"
type = "proxy"
base_url = "https://static.rust-lang.org"

[[rustup.sources]]
name = "tsinghua"
type = "proxy"
base_url = "https://mirrors.tuna.tsinghua.edu.cn/rustup"

[[rustup.sources]]
name = "group"
type = "group"
# 按顺序回退：official 失败时尝试 tsinghua。
members = ["official", "tsinghua"]

# 可选生态示例：Docker。
# 这里只保留 Docker Hub 镜像、GHCR 镜像和各自的官方源；
# 需要更多镜像时，按同样结构追加 source，并把 name 加入 group.members。
# dockerproxy/ghcr-nju 是第三方加速源；Stacktory 会校验下载内容的 digest。
[docker]

[[docker.sources]]
name = "dockerproxy"
type = "proxy"
base_url = "https://dockerproxy.net"

[[docker.sources]]
name = "official"
type = "proxy"
base_url = "https://registry-1.docker.io"

[[docker.sources]]
name = "ghcr-nju"
type = "proxy"
base_url = "https://ghcr.nju.edu.cn"

[[docker.sources]]
name = "ghcr"
type = "proxy"
base_url = "https://ghcr.io"

[[docker.sources]]
name = "group"
type = "group"
# Docker Hub 镜像优先走 dockerproxy；GHCR 镜像在 Docker Hub 路径 404 后命中 ghcr-nju。
members = ["dockerproxy", "official", "ghcr-nju", "ghcr"]
# 独立的 /v2/ 入口；listen_port 与 public_url 必须同时设置，且不能与 [server].port 冲突。
# 不配置这两行时，仍可通过主站的 /mirror/docker/<group>/v2/ 访问。
listen_port = 19000
public_url = "https://docker.example.internal:19000"

# 通用生态示例：npm。
# Cargo/NuGet/UPM/VS Code 使用相同的 sources 结构；
# Cargo 的 base_url 指向 index.crates.io，NuGet 必须指向 /v3/index.json。
[npm]

[[npm.sources]]
name = "official"
type = "proxy"
base_url = "https://registry.npmjs.org"

[[npm.sources]]
name = "npmmirror"
type = "proxy"
base_url = "https://registry.npmmirror.com"

[[npm.sources]]
name = "group"
type = "group"
members = ["official", "npmmirror"]
