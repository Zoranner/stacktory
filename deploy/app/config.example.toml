listen_address = "0.0.0.0"
listen_port = 18761
data_dir = "/app/data"
root_url = "https://stacktory.example.internal"

[rustup]
refresh_interval_secs = 3600
channels = ["stable", "beta", "nightly"]

[[rustup.sources]]
name = "official"
type = "proxy"
base_url = "https://static.rust-lang.org"

[[rustup.sources]]
name = "tsinghua"
type = "proxy"
base_url = "https://mirrors.tuna.tsinghua.edu.cn/rustup"

[[rustup.sources]]
name = "aliyun"
type = "proxy"
base_url = "https://mirrors.aliyun.com/rustup"

[[rustup.sources]]
name = "group"
type = "group"
members = ["official", "tsinghua", "aliyun"]

[cargo]

[[cargo.sources]]
name = "official"
type = "proxy"
base_url = "https://index.crates.io"

[[cargo.sources]]
name = "ustc"
type = "proxy"
base_url = "https://mirrors.ustc.edu.cn/crates.io-index"

[[cargo.sources]]
name = "group"
type = "group"
members = ["official", "ustc"]

[docker]

[[docker.sources]]
name = "official"
type = "proxy"
base_url = "https://registry-1.docker.io"
# Optional standard Docker CLI listener for this source.
# listen_port = 19001

[[docker.sources]]
name = "microsoft"
type = "proxy"
base_url = "https://mcr.microsoft.com"
# listen_port = 19002

[[docker.sources]]
name = "ghcr"
type = "proxy"
base_url = "https://ghcr.io"
# listen_port = 19003

[[docker.sources]]
name = "quay"
type = "proxy"
base_url = "https://quay.io"
# listen_port = 19004

[[docker.sources]]
name = "aliyun"
type = "proxy"
base_url = "https://registry.cn-hangzhou.aliyuncs.com"
# listen_port = 19005

[[docker.sources]]
name = "xuanyuan"
type = "proxy"
base_url = "https://docker.xuanyuan.me"
# listen_port = 19006

[[docker.sources]]
name = "unstructured"
type = "proxy"
base_url = "https://downloads.unstructured.io"
# listen_port = 19007

[[docker.sources]]
name = "group"
type = "group"
members = [
  "official",
  "microsoft",
  "ghcr",
  "quay",
  "aliyun",
  "xuanyuan",
  "unstructured",
]
# Optional group listener for standard Docker CLI use.
# listen_port = 19000

