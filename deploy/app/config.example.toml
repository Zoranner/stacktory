[docker]

[[docker.sources]]
name = "official"
type = "proxy"
base_url = "https://registry-1.docker.io"
# 可选：为此来源启动标准 Docker CLI 监听端口。
# cli_listen_port = 19001

[[docker.sources]]
name = "microsoft"
type = "proxy"
base_url = "https://mcr.microsoft.com"
# cli_listen_port = 19002

[[docker.sources]]
name = "ghcr"
type = "proxy"
base_url = "https://ghcr.io"
# cli_listen_port = 19003

[[docker.sources]]
name = "quay"
type = "proxy"
base_url = "https://quay.io"
# cli_listen_port = 19004

[[docker.sources]]
name = "aliyun"
type = "proxy"
base_url = "https://registry.cn-hangzhou.aliyuncs.com"
# cli_listen_port = 19005

[[docker.sources]]
name = "xuanyuan"
type = "proxy"
base_url = "https://docker.xuanyuan.me"
# cli_listen_port = 19006

[[docker.sources]]
name = "unstructured"
type = "proxy"
base_url = "https://downloads.unstructured.io"
# cli_listen_port = 19007

[[docker.sources]]
name = "group"
type = "group"
# 官方 Docker Hub 始终排在首位，备用来源按此顺序回退。
members = [
  "official",
  "ghcr",
  "quay",
  "microsoft",
  "aliyun",
  "xuanyuan",
  "unstructured",
]
# group 入口的标准 Docker CLI 监听端口。
cli_listen_port = 19000

