listen_address = "0.0.0.0"
listen_port = 18761
data_dir = "/app/data"
root_url = "https://stacktory.example.internal"

[rustup]
refresh_interval_secs = 3600
channels = ["stable", "beta", "nightly"]

[[rustup.sources]]
name = "rust-lang"
type = "proxy"
base_url = "https://static.rust-lang.org"

[[rustup.sources]]
name = "group"
type = "group"
members = ["rust-lang"]

[cargo]

[[cargo.sources]]
name = "crates-io"
type = "proxy"
base_url = "https://index.crates.io"
