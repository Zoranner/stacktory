# 进程级监听端点和客户端可见地址。
[server]
address = "0.0.0.0"
port = 18000
# 经反向代理发布时，这里的端口可以与监听端口不同。
public_url = "https://stacktory.example.internal"

# 持久化数据和运行日志目录。
[storage]
data_dir = "/app/data"
log_dir = "/app/logs"

# 可选：访问上游时使用的 HTTP/HTTPS 出站代理。
# [proxy]
# url = "http://127.0.0.1:7890"
# no_proxy = "localhost,127.0.0.1,.internal"

[retention]
# 超过此时长的生态 metadata 文件会被保留清理任务删除。
metadata_retention_secs = 604800
# 轮转后的审计文件保留天数。
audit_retention_days = 30
# 保留清理任务的执行间隔。
cleanup_interval_secs = 3600
# 每个入口和 channel 保留的 Rustup 快照版本数。
rustup_snapshot_revisions = 3
# 制品对象空闲超过此时长后删除；设为 0 表示禁用空闲淘汰。
artifact_idle_secs = 7776000
# 轮转后的运行日志保留天数。
log_retention_days = 30

[rustup]
refresh_interval_secs = 3600
channels = ["stable", "beta", "nightly"]

[[rustup.sources]]
name = "official"
type = "proxy"
base_url = "https://static.rust-lang.org"

[[rustup.sources]]
name = "tsinghua"
type = "proxy"
base_url = "https://mirrors.tuna.tsinghua.edu.cn/rustup"

[[rustup.sources]]
name = "aliyun"
type = "proxy"
base_url = "https://mirrors.aliyun.com/rustup"

[[rustup.sources]]
name = "group"
type = "group"
members = ["official", "tsinghua", "aliyun"]

