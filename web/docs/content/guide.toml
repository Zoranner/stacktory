title = "使用说明"
summary = "可以直接按手动步骤配置，也可以把提示词复制给智能体。所有操作先备份，失败时停止。"

[[sections]]
title = "配置前"
items = [
  "先确认要配置的技术栈和当前可用的入口。",
  "修改前备份目标配置文件，只修改当前技术栈需要的键或条目。",
  "不要把账号、token、密码或无关配置写进文件。",
]

[[sections]]
title = "配置后"
items = [
  "执行页面给出的验证命令，确认配置已经生效。",
  "验证失败时停止，保留备份并报告实际结果。",
  "Proxy 只访问自身；Group 按成员顺序回退。",
]
