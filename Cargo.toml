[package]
name = "stacktory"
version = "0.3.0"
edition = "2024"
# 当前发布和门禁使用的工具链；降低前需要先用目标版本跑完整测试。
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
reqwest = { version = "0.12.24", default-features = false, features = ["gzip", "rustls-tls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9.8"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tempfile = "3.24.0"
tower = { version = "0.5.3", features = ["util"] }
